<style>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { zipSync, strToU8 } from 'fflate';

// ---------- Admin Authentication Gate ----------
const authOverlay = document.getElementById('authOverlay');
const adminPass = document.getElementById('adminPass');
const authError = document.getElementById('authError');
const VALID_PASSES = ['18studio', '1818', 'montree'];
if (sessionStorage.getItem('adminUnlocked') === '1') {
  authOverlay.classList.add('hidden');
}
function tryUnlock() {
  if (VALID_PASSES.includes(adminPass.value.trim().toLowerCase())) {
    sessionStorage.setItem('adminUnlocked', '1');
    authOverlay.classList.add('hidden');
  } else {
    authError.textContent = 'Mật khẩu không đúng!';
  }
}
document.getElementById('loginBtn').onclick = tryUnlock;
adminPass.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

const PALETTE = ['#f4f1ea','#1e1e1e','#e2574c','#f2a541','#f7d84a','#7bc67b','#4aa3df','#8a6fdf','#f48fb1','#9e9e9e'];
const TOP_Z = 5.0, EPS = 0.02;
const CAP_SIZE = 18, GAP = 4;
const BLANK_FILE = 'obj_16_keycap.stl';
const DEFAULT_TTF = 'SVN-Comic Sans MS.ttf';
const MAX_FILAMENTS = 16;

const BASE_STYLE1_FILES = {
  1: 'obj_1_1 slot - switch hole.stl',
  2: 'obj_2_2 slots - switch hole.stl',
  3: 'obj_3_3 slots - switch hole.stl',
  4: 'obj_4_4 slots - switch hole.stl',
  5: 'obj_5_5 slots - switch hole.stl',
  6: 'obj_7_6 slots - switch hole.stl',
  7: 'obj_8_7 slots - switch hole.stl',
  8: 'obj_9_8 slots - switch hole.stl',
  9: 'obj_10_9 slots - switch hole.stl',
  10: 'obj_6_10 slots - switch hole.stl'
};
const BASE_PITCH = 20.5;
const BASE_KEYCHAIN_OFFSET_X = 1.94;
const PREVIEW_CAP_Z = 14.5;

// ---------- Scene ----------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1d1f24');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 2000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(20, -20, 40);
scene.add(dir);

const display = new THREE.Group();
scene.add(display);

let currentWidth = null, userRotated = false;
controls.addEventListener('start', () => { userRotated = true; controls.autoRotate = false; });
function frameCamera(width, targetZ = 3) {
  controls.target.z = targetZ;
  if (currentWidth === width) return;
  const aspect = Math.max(0.4, (view.clientWidth || 1) / (view.clientHeight || 1));
  const effWidth = aspect < 1 ? width / aspect : width;
  const d = Math.max(30, effWidth * 1.1);
  if (currentWidth === null) {
    camera.position.set(0, -d, d + targetZ);
    controls.target.set(0, 0, targetZ);
    controls.autoRotateSpeed = 1.5;
  } else {
    const offset = camera.position.clone().sub(controls.target);
    const dirVec = offset.lengthSq() > 0 ? offset.normalize() : new THREE.Vector3(0, -1, 1).normalize();
    camera.position.copy(controls.target).addScaledVector(dirVec, d * Math.SQRT2);
  }
  controls.autoRotate = !userRotated && width < 40;
  currentWidth = width;
}

// ---------- Per-key & Base colors ----------
const defaults = { cap: '#f4f1ea', legend: '#e2574c' };
let keyColors = [];
let keys = [];
let selected = -1;
let baseMesh = null;
let baseMat = null;

const capColor = document.getElementById('capColor'), legendColor = document.getElementById('legendColor');
const baseColor = document.getElementById('baseColor');
const editingEl = document.getElementById('editing');

function colorsFor(i) { return keyColors[i] ||= { ...defaults }; }

function refreshMaterials() {
  keys.forEach((k, i) => {
    const c = colorsFor(i);
    k.capMat.color.set(c.cap);
    k.legMat.color.set(c.legend);
    const glow = i === selected ? 0x223344 : 0x000000;
    k.capMat.emissive.setHex(glow);
    k.legMat.emissive.setHex(glow);
  });
  if (baseMat) baseMat.color.set(baseColor.value);
  updateColorInfo();
}

function select(i) {
  selected = i;
  const c = i < 0 ? defaults : colorsFor(i);
  capColor.value = c.cap;
  legendColor.value = c.legend;
  editingEl.textContent = i < 0 ? 'Tất cả' : `Phím ${i + 1}${keys[i]?.label ? ' (' + keys[i].label + ')' : ''}`;
  refreshMaterials();
}

function setColor(part, value) {
  if (selected < 0) {
    defaults[part] = value;
    keyColors.forEach(c => c[part] = value);
  } else {
    colorsFor(selected)[part] = value;
  }
  refreshMaterials();
}
capColor.oninput = () => setColor('cap', capColor.value);
legendColor.oninput = () => setColor('legend', legendColor.value);
baseColor.oninput = refreshMaterials;
document.getElementById('selectAll').onclick = () => select(-1);
document.querySelectorAll('.swatches').forEach(box => PALETTE.forEach(col => {
  const b = document.createElement('button');
  b.style.background = col;
  b.onclick = () => {
    const input = document.getElementById(box.dataset.target);
    input.value = col;
    input.oninput();
  };
  box.appendChild(b);
}));

const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(display.children, true)[0];
  if (hit && hit.object.parent?.userData.index !== undefined) select(hit.object.parent.userData.index);
  else select(-1);
});

// ---------- STL loading: keycaps & bases ----------
function splitGeometry(geo) {
  geo.computeBoundingBox();
  const c = new THREE.Vector3(); geo.boundingBox.getCenter(c);
  geo.translate(-c.x, -c.y, 0);
  const pos = geo.attributes.position.array, nor = geo.attributes.normal.array;
  const cap = { p: [], n: [] }, leg = { p: [], n: [] };
  for (let i = 0; i < pos.length; i += 9) {
    const z0 = pos[i+2], z1 = pos[i+5], z2 = pos[i+8];
    const isLegend = Math.min(z0, z1, z2) >= TOP_Z - EPS && Math.max(z0, z1, z2) > TOP_Z + EPS;
    const t = isLegend ? leg : cap;
    for (let k = 0; k < 9; k++) { t.p.push(pos[i+k]); t.n.push(nor[i+k]); }
  }
  const make = t => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(t.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(t.n, 3));
    return g;
  };
  return { cap: make(cap), legend: make(leg) };
}

function centerBaseGeometry(geo) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const cx = (bb.min.x + bb.max.x) / 2 + BASE_KEYCHAIN_OFFSET_X;
  const cy = (bb.min.y + bb.max.y) / 2;
  geo.translate(-cx, -cy, -bb.min.z);
  return geo;
}

const stlLoader = new STLLoader();
const cache = {};
const baseCache = {};
const loadingEl = document.getElementById('loading');

async function getParts(file) {
  if (!cache[file]) cache[file] = splitGeometry(await stlLoader.loadAsync('Chunky+Keycaps_stls/' + encodeURIComponent(file)));
  return cache[file];
}

async function getBaseGeo(slots) {
  const s = Math.max(1, Math.min(10, slots));
  if (!baseCache[s]) {
    const path = `Compact+Fidget+Clicker+-+Base_stls/${encodeURIComponent(BASE_STYLE1_FILES[s])}`;
    baseCache[s] = centerBaseGeometry(await stlLoader.loadAsync(path));
  }
  return baseCache[s];
}

function clearDisplay() {
  display.traverse(o => { if (o.isMesh) { if (o.userData.ownGeo) o.geometry.dispose(); o.material.dispose(); } });
  display.clear();
  keys = [];
  baseMesh = null;
  baseMat = null;
}

function addKey(capGeo, legGeo, x, y, z, label, ownLegend) {
  const index = keys.length;
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.userData.index = index;
  const capMat = new THREE.MeshStandardMaterial({ roughness: 0.55 });
  const legMat = new THREE.MeshStandardMaterial({ roughness: 0.4 });
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.userData.part = 'cap';
  group.add(cap);
  if (legGeo && legGeo.attributes.position.count > 0) {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.userData.part = 'legend';
    leg.userData.ownGeo = ownLegend;
    group.add(leg);
  }
  display.add(group);
  keys.push({ group, capMat, legMat, label, x, y });
}

function addBase(geo) {
  baseMat = new THREE.MeshStandardMaterial({ color: baseColor.value, roughness: 0.55 });
  baseMesh = new THREE.Mesh(geo, baseMat);
  baseMesh.userData.part = 'base';
  display.add(baseMesh);
}

function finishBuild(width, targetZ = 3) {
  keyColors.length = Math.max(keyColors.length, keys.length);
  if (selected >= keys.length) selected = -1;
  select(selected);
  loadingEl.textContent = '';
  frameCamera(width, targetZ);
}

// ---------- Keycap sequence (Text + Icons at ANY position) ----------
let mode = 'text';
let font = null;
let icons = []; // [{name, file, afterText}] where afterText = number of text chunks before this icon

const textInput = document.getElementById('textInput'), perCapInput = document.getElementById('perCap');
const capCountEl = document.getElementById('capCount');
const baseSlotsSelect = document.getElementById('baseSlots');
const baseSlotHint = document.getElementById('baseSlotHint');
const iconSearch = document.getElementById('iconSearch');
const iconSelect = document.getElementById('iconSelect');
const addedIconsEl = document.getElementById('addedIcons');

function getTextChunks() {
  const chars = [...textInput.value.replace(/\s+/g, '')];
  const per = Math.max(1, Math.min(6, parseInt(perCapInput.value) || 1));
  const chunks = [];
  for (let i = 0; i < chars.length; i += per) chunks.push(chars.slice(i, i + per).join(''));
  return chunks;
}

function getSequence() {
  const chunks = getTextChunks();
  const T = chunks.length;
  icons.forEach(ic => { ic.afterText = Math.max(0, Math.min(T, ic.afterText)); });
  const seq = [];
  for (let t = 0; t <= T; t++) {
    icons.forEach((ic, idx) => {
      if (ic.afterText === t) seq.push({ type: 'icon', file: ic.file, label: ic.name, iconIdx: idx });
    });
    if (t < T) seq.push({ type: 'text', label: chunks[t], textIdx: t });
  }
  return seq;
}

function getTextModeItems() {
  const seq = getSequence();
  return seq.length ? seq : [{ type: 'text', label: '' }];
}

function updateIconControls() {
  const seq = getSequence();
  addedIconsEl.innerHTML = '';
  seq.forEach((it, seqIdx) => {
    if (it.type !== 'icon') return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    const title = document.createElement('span');
    title.textContent = `Phím ${seqIdx + 1}: ${it.label}`;
    const actions = document.createElement('div');
    actions.className = 'chip-actions';

    const leftBtn = document.createElement('button');
    leftBtn.textContent = '◀';
    leftBtn.title = 'Dịch sang trái';
    leftBtn.disabled = seqIdx === 0;
    leftBtn.onclick = () => moveIcon(it.iconIdx, -1);

    const rightBtn = document.createElement('button');
    rightBtn.textContent = '▶';
    rightBtn.title = 'Dịch sang phải';
    rightBtn.disabled = seqIdx === seq.length - 1;
    rightBtn.onclick = () => moveIcon(it.iconIdx, 1);

    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '×';
    delBtn.title = 'Xóa biểu tượng';
    delBtn.onclick = () => { icons.splice(it.iconIdx, 1); refreshScene(); };

    actions.append(leftBtn, rightBtn, delBtn);
    chip.append(title, actions);
    addedIconsEl.appendChild(chip);
  });
}

function moveIcon(iconIdx, dir) {
  const seq = getSequence();
  const pos = seq.findIndex(it => it.type === 'icon' && it.iconIdx === iconIdx);
  const targetPos = pos + dir;
  if (targetPos < 0 || targetPos >= seq.length) return;
  const neighbor = seq[targetPos];
  if (neighbor.type === 'text') {
    icons[iconIdx].afterText += dir;
  } else {
    const otherIdx = neighbor.iconIdx;
    const tmp = icons[iconIdx];
    icons[iconIdx] = icons[otherIdx];
    icons[otherIdx] = tmp;
  }
  refreshScene();
}

const WEIGHTS = [
  ['Thin', -0.05], ['Light', -0.025], ['Regular', 0], ['Medium', 0.02],
  ['Bold', 0.04], ['Extra Bold', 0.065], ['Black', 0.09]
];
const weightInput = document.getElementById('fontWeight');
function makeLegend(str, size, depth) {
  const offset = WEIGHTS[weightInput.value][1] * size;
  const geo = new TextGeometry(str, {
    font, size, height: depth, curveSegments: 6,
    bevelEnabled: offset !== 0, bevelThickness: 0, bevelSize: 0, bevelOffset: offset, bevelSegments: 1
  });
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
  const maxW = CAP_SIZE - 4;
  const s = Math.min(1, maxW / w, maxW / h);
  geo.translate(-(bb.min.x + w / 2), -(bb.min.y + h / 2), 0);
  geo.scale(s, s, 1);
  geo.translate(0, 0, TOP_Z - 0.05);
  return geo;
}

async function showText() {
  if (mode !== 'text') return;
  updateIconControls();
  if (!font) { loadingEl.textContent = 'Đang tải font…'; return; }
  const items = getTextModeItems();
  capCountEl.textContent = `${items.length} keycap sẽ được tạo`;
  updateSlotHint();

  loadingEl.textContent = 'Đang tải…';
  const blank = await getParts(BLANK_FILE);
  const iconFiles = [...new Set(items.filter(it => it.type === 'icon').map(it => it.file))];
  await Promise.all(iconFiles.map(f => getParts(f)));
  if (mode !== 'text') return;

  const size = parseFloat(document.getElementById('textSize').value) || 11;
  const depth = parseFloat(document.getElementById('textDepth').value) || 0.6;
  clearDisplay();
  const maxCols = window.innerWidth <= 768 ? 5 : 10;
  const pitch = CAP_SIZE + GAP, cols = Math.min(items.length, maxCols);
  items.forEach((it, i) => {
    const x = (i % cols - (cols - 1) / 2) * pitch;
    const y = -Math.floor(i / cols) * pitch;
    if (it.type === 'icon') {
      const parts = cache[it.file];
      addKey(parts.cap, parts.legend, x, y, 0, it.label, false);
    } else {
      addKey(blank.cap, it.label ? makeLegend(it.label, size, depth) : null, x, y, 0, it.label, true);
    }
  });
  finishBuild(cols * pitch, 3);
}

// ---------- Base mode ----------
async function showBase() {
  if (mode !== 'base') return;
  const slots = getActiveSlots();
  updateSlotHint();
  loadingEl.textContent = 'Đang tải…';
  const baseGeo = await getBaseGeo(slots);
  if (mode !== 'base') return;
  clearDisplay();
  addBase(baseGeo);
  finishBuild(22 + (slots - 1) * BASE_PITCH + 6, 8);
}

// ---------- Preview mode (Keycaps mounted on top of Base) ----------
async function showPreview() {
  if (mode !== 'preview') return;
  const slots = getActiveSlots();
  updateSlotHint();
  loadingEl.textContent = 'Đang tải…';

  if (!font) { loadingEl.textContent = 'Đang tải font…'; return; }
  const items = getTextModeItems();
  const iconFiles = [...new Set(items.filter(it => it.type === 'icon').map(it => it.file))];
  const [baseGeo, blank] = await Promise.all([
    getBaseGeo(slots),
    getParts(BLANK_FILE),
    ...iconFiles.map(f => getParts(f))
  ]);
  if (mode !== 'preview') return;
  const size = parseFloat(document.getElementById('textSize').value) || 11;
  const depth = parseFloat(document.getElementById('textDepth').value) || 0.6;
  clearDisplay();
  addBase(baseGeo);
  for (let i = 0; i < slots; i++) {
    const it = items[i] || { type: 'text', label: '' };
    const x = (i - (slots - 1) / 2) * BASE_PITCH;
    if (it.type === 'icon') {
      const parts = cache[it.file];
      addKey(parts.cap, parts.legend, x, 0, PREVIEW_CAP_Z, it.label, false);
    } else {
      addKey(blank.cap, it.label ? makeLegend(it.label, size, depth) : null, x, 0, PREVIEW_CAP_Z, it.label, true);
    }
  }
  finishBuild(22 + (slots - 1) * BASE_PITCH + 6, 10);
}

// ---------- Helpers for export ----------
function download(data, filename, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function baseName() {
  if (mode === 'base') return `base_${getActiveSlots()}_slots`;
  const kName = 'keycaps_' + (textInput.value.replace(/[^\w]/g, '') || 'custom');
  return mode === 'preview' ? `${kName}_with_base` : kName;
}

// ---------- PNG Image Export ----------
function exportPNG() {
  keys.forEach(k => { k.capMat.emissive.setHex(0); k.legMat.emissive.setHex(0); });
  renderer.render(scene, camera);

  const src = renderer.domElement;
  const footerH = Math.max(70, Math.round(src.height * 0.1));
  const out = document.createElement('canvas');
  out.width = src.width;
  out.height = src.height + footerH;
  const ctx = out.getContext('2d');

  ctx.drawImage(src, 0, 0);
  ctx.fillStyle = '#262930';
  ctx.fillRect(0, src.height, out.width, footerH);

  const pad = Math.round(footerH * 0.28);
  const fontSize = Math.max(13, Math.round(footerH * 0.25));
  ctx.fillStyle = '#eee';
  ctx.font = `600 ${fontSize}px system-ui, sans-serif`;
  const slots = getActiveSlots();
  const summary = mode === 'base'
    ? `18.studio · Đế (${slots} khe) · Màu đế: ${baseColor.value.toUpperCase()}`
    : `18.studio · Đế (${slots} khe) · Đế ${baseColor.value.toUpperCase()} · ${keys.length} phím`;
  ctx.fillText(summary, pad, src.height + Math.round(footerH * 0.62));

  const cols = usedColors();
  const r = Math.max(9, Math.round(footerH * 0.22));
  let cx = out.width - pad - r;
  const cy = src.height + Math.round(footerH / 2);
  for (let i = cols.length - 1; i >= 0; i--) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = cols[i];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#555';
    ctx.stroke();
    cx -= r * 2.5;
  }

  refreshMaterials();
  out.toBlob(blob => download(blob, baseName() + '.png', 'image/png'), 'image/png');
}
document.getElementById('exportPng').onclick = exportPNG;

// World-space, vertex-merged geometry of a mesh, optionally overriding its world offset
function worldGeometry(mesh, overridePos = null) {
  mesh.updateWorldMatrix(true, false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', mesh.geometry.attributes.position.clone());
  if (mesh.geometry.index) g.setIndex(mesh.geometry.index.clone());
  if (overridePos) {
    const m = new THREE.Matrix4().makeTranslation(overridePos.x, overridePos.y, overridePos.z);
    g.applyMatrix4(m);
  } else {
    g.applyMatrix4(mesh.matrixWorld);
  }
  return mergeVertices(g, 1e-4);
}

// ---------- STL export ----------
const exporter = new STLExporter();
function exportSTL(part, filename) {
  const group = new THREE.Group();
  if ((!part || part === 'base') && baseMesh) {
    const pos = mode === 'preview' && !part ? new THREE.Vector3(0, 18, 0) : new THREE.Vector3(0, 0, 0);
    group.add(new THREE.Mesh(worldGeometry(baseMesh, pos)));
  }
  if (!part || part === 'cap' || part === 'legend') {
    keys.forEach(k => {
      const pos = mode === 'preview' ? new THREE.Vector3(k.x, !part ? -12 : 0, 0) : null;
      k.group.children.forEach(m => {
        if (m.isMesh && (!part || m.userData.part === part) && m.geometry.attributes.position.count) {
          group.add(new THREE.Mesh(worldGeometry(m, pos)));
        }
      });
    });
  }
  if (!group.children.length) return;
  download(exporter.parse(group, { binary: true }), filename, 'model/stl');
}
document.getElementById('exportAll').onclick = () => exportSTL(null, baseName() + '.stl');
document.getElementById('exportParts').onclick = () => {
  if (mode === 'preview') {
    exportSTL('base', baseName() + '_base.stl');
    setTimeout(() => exportSTL('cap', baseName() + '_keycap.stl'), 250);
    setTimeout(() => exportSTL('legend', baseName() + '_legend.stl'), 500);
  } else {
    exportSTL('cap', baseName() + '_keycap.stl');
    setTimeout(() => exportSTL('legend', baseName() + '_legend.stl'), 300);
  }
};

// ---------- 3MF export (Bambu Studio compatible, with filament colors) ----------
function usedColors() {
  const list = [];
  const add = col => {
    col = col.toUpperCase();
    if (!list.includes(col)) list.push(col);
  };
  if (mode === 'base' || mode === 'preview') add(baseColor.value);
  if (mode !== 'base') {
    keys.forEach((k, i) => {
      const c = colorsFor(i);
      add(c.cap);
      if (k.group.children.length > 1) add(c.legend);
    });
  }
  return list;
}
function updateColorInfo() {
  const n = usedColors().length;
  document.getElementById('colorInfo').textContent =
    `${n} màu nhựa được dùng` + (n > MAX_FILAMENTS ? ` - quá nhiều màu! Tối đa ${MAX_FILAMENTS}.` : '');
}

const PRINTERS = {
  X1C: { model: 'Bambu Lab X1 Carbon', printer: 'Bambu Lab X1 Carbon 0.4 nozzle', process: '0.20mm Standard @BBL X1C', filament: 'Bambu PLA Basic @BBL X1C' },
  X1:  { model: 'Bambu Lab X1',        printer: 'Bambu Lab X1 0.4 nozzle',        process: '0.20mm Standard @BBL X1C', filament: 'Bambu PLA Basic @BBL X1C' },
  X1E: { model: 'Bambu Lab X1E',       printer: 'Bambu Lab X1E 0.4 nozzle',       process: '0.20mm Standard @BBL X1E', filament: 'Bambu PLA Basic @BBL X1E' },
  P1S: { model: 'Bambu Lab P1S',       printer: 'Bambu Lab P1S 0.4 nozzle',       process: '0.20mm Standard @BBL X1C', filament: 'Bambu PLA Basic @BBL X1C' },
  P1P: { model: 'Bambu Lab P1P',       printer: 'Bambu Lab P1P 0.4 nozzle',       process: '0.20mm Standard @BBL P1P', filament: 'Bambu PLA Basic @BBL P1P' },
  A1:  { model: 'Bambu Lab A1',        printer: 'Bambu Lab A1 0.4 nozzle',        process: '0.20mm Standard @BBL A1',  filament: 'Bambu PLA Basic @BBL A1' },
  A1M: { model: 'Bambu Lab A1 mini',   printer: 'Bambu Lab A1 mini 0.4 nozzle',   process: '0.20mm Standard @BBL A1M', filament: 'Bambu PLA Basic @BBL A1M' },
  none: null
};
const presetSelect = document.getElementById('printerPreset');
const presetHint = document.getElementById('presetHint');
function updatePresetHint() {
  presetHint.textContent = presetSelect.value === 'none'
    ? 'Chỉ lưu màu nhựa.'
    : 'Dùng preset của Bambu (PLA Basic, 0.20mm Standard, 0.4 nozzle).';
  localStorage.setItem('printerPreset', presetSelect.value);
}
presetSelect.value = localStorage.getItem('printerPreset') || 'X1C';
presetSelect.onchange = updatePresetHint;
updatePresetHint();

function paintCode(n) {
  if (n < 3) return (n << 2).toString(16).toUpperCase();
  return 'C' + (n - 3).toString(16).toUpperCase();
}
function paintAttr(n) { return [...paintCode(n)].reverse().join(''); }

function export3MF() {
  const colors = usedColors();
  if (colors.length > MAX_FILAMENTS) { alert(`Quá nhiều màu (${colors.length}). Tối đa ${MAX_FILAMENTS}.`); return; }
  const fil = col => colors.indexOf(col.toUpperCase()) + 1;

  const half = presetSelect.value === 'A1M' ? 90 : 128;
  const OFFSET = new THREE.Vector3(half, half, 0);
  const objectsXml = [], buildXml = [], settingsXml = [];
  let nextObjId = 2;

  if (baseMesh && (mode === 'base' || mode === 'preview')) {
    const basePos = mode === 'preview' ? new THREE.Vector3(0, 18, 0) : new THREE.Vector3(0, 0, 0);
    const g = worldGeometry(baseMesh, basePos);
    const p = g.attributes.position.array, idx = g.index.array;
    const baseFil = fil(baseColor.value);
    let v = '', t = '';
    for (let j = 0; j < p.length; j += 3) {
      v += `<vertex x="${(p[j] + OFFSET.x).toFixed(4)}" y="${(p[j+1] + OFFSET.y).toFixed(4)}" z="${(p[j+2] + OFFSET.z).toFixed(4)}"/>\n`;
    }
    for (let j = 0; j < idx.length; j += 3) {
      t += `<triangle v1="${idx[j]}" v2="${idx[j+1]}" v3="${idx[j+2]}" pid="1" p1="${baseFil - 1}"/>\n`;
    }
    const name = `Base (${getActiveSlots()} slots)`;
    const objId = nextObjId++;
    objectsXml.push(`<object id="${objId}" type="model" name="${name}" pid="1" pindex="${baseFil - 1}"><mesh><vertices>\n${v}</vertices><triangles>\n${t}</triangles></mesh></object>`);
    buildXml.push(`<item objectid="${objId}" printable="1"/>`);
    settingsXml.push(`  <object id="${objId}">
    <metadata key="name" value="${name}"/>
    <metadata key="extruder" value="${baseFil}"/>
  </object>`);
  }

  if (mode !== 'base') {
    keys.forEach((k, i) => {
      const c = colorsFor(i);
      const verts = [], tris = [];
      const keyPos = mode === 'preview' ? new THREE.Vector3(k.x, -12, 0) : null;
      k.group.children.forEach(mesh => {
        if (!mesh.geometry.attributes.position.count) return;
        const g = worldGeometry(mesh, keyPos);
        const p = g.attributes.position.array, idx = g.index.array;
        const base = verts.length / 3;
        for (let j = 0; j < p.length; j += 3) verts.push(p[j] + OFFSET.x, p[j+1] + OFFSET.y, p[j+2] + OFFSET.z);
        const n = fil(mesh.userData.part === 'cap' ? c.cap : c.legend);
        for (let j = 0; j < idx.length; j += 3) tris.push([idx[j] + base, idx[j+1] + base, idx[j+2] + base, n]);
      });
      const id = i + 1;
      const objId = nextObjId++;
      const capFil = fil(c.cap);
      let v = '', t = '';
      for (let j = 0; j < verts.length; j += 3) v += `<vertex x="${verts[j].toFixed(4)}" y="${verts[j+1].toFixed(4)}" z="${verts[j+2].toFixed(4)}"/>\n`;
      for (const [a, b, cc, n] of tris) {
        t += `<triangle v1="${a}" v2="${b}" v3="${cc}" pid="1" p1="${n - 1}"${n !== capFil ? ` paint_color="${paintAttr(n)}"` : ''}/>\n`;
      }
      const name = k.label ? `Key ${id} - ${k.label}` : `Keycap ${id}`;
      objectsXml.push(`<object id="${objId}" type="model" name="${name}" pid="1" pindex="${capFil - 1}"><mesh><vertices>\n${v}</vertices><triangles>\n${t}</triangles></mesh></object>`);
      buildXml.push(`<item objectid="${objId}" printable="1"/>`);
      settingsXml.push(`  <object id="${objId}">
    <metadata key="name" value="${name}"/>
    <metadata key="extruder" value="${capFil}"/>
  </object>`);
    });
  }

  const model = `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">
<metadata name="Application">BambuStudio-01.09.00.00</metadata>
<metadata name="Title">${baseName()}</metadata>
<resources>
<basematerials id="1">
${colors.map((col, i) => `<base name="Filament ${i + 1}" displaycolor="${col}FF"/>`).join('\n')}
</basematerials>
${objectsXml.join('\n')}
</resources>
<build>
${buildXml.join('\n')}
</build>
</model>`;

  const modelSettings = `<?xml version="1.0" encoding="UTF-8"?>
<config>
${settingsXml.join('\n')}
</config>`;

  const preset = PRINTERS[presetSelect.value];
  const settings = { filament_colour: colors, version: '01.09.00.00' };
  if (preset) {
    Object.assign(settings, {
      printer_model: preset.model,
      printer_settings_id: preset.printer,
      print_settings_id: preset.process,
      filament_settings_id: colors.map(() => preset.filament),
      filament_type: colors.map(() => 'PLA'),
      filament_ids: colors.map(() => 'GFA00'),
      filament_vendor: colors.map(() => 'Bambu Lab'),
      from: 'project',
      name: 'project_settings'
    });
  }
  const projectSettings = JSON.stringify(settings, null, 2);

  const contentTypes = `<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>
<Default Extension="config" ContentType="text/xml"/>
</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/>
</Relationships>`;

  const zip = zipSync({
    '[Content_Types].xml': strToU8(contentTypes),
    '_rels/.rels': strToU8(rels),
    '3D/3dmodel.model': strToU8(model),
    'Metadata/model_settings.config': strToU8(modelSettings),
    'Metadata/project_settings.config': strToU8(projectSettings)
  }, { level: 6 });
  download(zip, baseName() + '.3mf', 'model/3mf');
}
document.getElementById('export3mf').onclick = export3MF;
