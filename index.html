<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>18.studio Keycap Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; height: 100dvh; background: #1d1f24; color: #eee; overflow: hidden; }
  #panel { width: 345px; padding: 20px; background: #262930; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  h1 { font-size: 20px; margin: 0; }
  label { font-size: 13px; color: #aaa; display: block; margin-bottom: 6px; }
  select, input[type=search], input[type=text], input[type=number] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #1d1f24; color: #eee; }
  input[type=color] { width: 100%; height: 40px; border: none; border-radius: 6px; background: none; cursor: pointer; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #555; cursor: pointer; }
  .tabs { display: flex; gap: 6px; }
  .tabs button, .btn { flex: 1; padding: 9px 8px; border-radius: 6px; border: 1px solid #444; background: #1d1f24; color: #eee; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .tabs button.active { background: #4aa3df; border-color: #4aa3df; color: #fff; font-weight: 600; }
  .btn.primary { background: #7bc67b; border-color: #7bc67b; color: #111; font-weight: 600; }
  .btn.blue { background: #4aa3df; border-color: #4aa3df; color: #fff; font-weight: 600; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  .row { display: flex; gap: 8px; }
  .box { background: #1d1f24; border: 1px solid #3a3d45; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .chips { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .chip { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #262930; border: 1px solid #444; border-radius: 8px; padding: 5px 8px; font-size: 12.5px; color: #ddd; }
  .chip-actions { display: flex; align-items: center; gap: 4px; }
  .chip-actions button { background: #1d1f24; border: 1px solid #444; border-radius: 4px; color: #ddd; cursor: pointer; font-size: 12px; padding: 2px 6px; line-height: 1.2; }
  .chip-actions button.del { color: #f26d6d; border-color: #633; }
  #editing { font-weight: 600; color: #4aa3df; }
  #view { flex: 1; position: relative; min-width: 0; min-height: 0; }
  #view canvas { display: block; touch-action: none; }
  #loading { position: absolute; top: 12px; left: 12px; font-size: 13px; color: #aaa; pointer-events: none; }
  #tip { position: absolute; bottom: 12px; left: 12px; right: 12px; font-size: 12px; color: #777; pointer-events: none; }
  .hidden { display: none !important; }
  @media (max-width: 768px) {
    body { flex-direction: column-reverse; }
    #view { flex: 0 0 42%; min-height: 210px; width: 100%; }
    #panel { flex: 1; width: 100%; padding: 14px 16px 24px; gap: 14px; border-top: 1px solid #3a3d45; }
    h1 { font-size: 18px; }
    select, input[type=search], input[type=text], input[type=number] { font-size: 16px; }
    .swatches button { width: 30px; height: 30px; }
    .tabs button, .btn { padding: 9px 6px; font-size: 13px; }
    #tip { font-size: 11px; bottom: 8px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<body>
<div id="panel">
  <h1>18.studio Keycap Maker</h1>
  <div class="tabs">
    <button id="tabText" class="active">Văn bản</button>
    <button id="tabBase">Đế</button>
    <button id="tabPreview">Xem trước</button>
  </div>

  <!-- Custom text & icon mode -->
  <div id="textSection" style="display:flex;flex-direction:column;gap:14px">
    <div>
      <label>Văn bản</label>
      <input type="text" id="textInput" value="montree" maxlength="60">
    </div>
    <div>
      <label>Số lượng ký tự trên mỗi keycap</label>
      <input type="number" id="perCap" min="1" max="6" value="1">
      <div class="hint" id="capCount"></div>
    </div>
    <div class="box">
      <label style="margin-bottom:0">Chèn keycap biểu tượng</label>
      <input type="search" id="iconSearch" placeholder="Tìm biểu tượng (vd: Trái tim, Mèo)...">
      <select id="iconSelect"></select>
      <div class="row">
        <button class="btn" id="addIconStart">+ Thêm đầu</button>
        <button class="btn" id="addIconEnd">+ Thêm cuối</button>
      </div>

    </div>
  </div>

  <!-- Base settings & color -->
  <div id="baseSection" class="box hidden">
    <div>
      <label>Số khe đế (Slots)</label>
      <select id="baseSlots">
        <option value="auto">Tự động theo số keycap</option>
        <option value="1">1 khe</option>
        <option value="2">2 khe</option>
        <option value="3">3 khe</option>
        <option value="4">4 khe</option>
        <option value="5">5 khe</option>
        <option value="6">6 khe</option>
        <option value="7">7 khe</option>
        <option value="8">8 khe</option>
        <option value="9">9 khe</option>
        <option value="10">10 khe</option>
      </select>
      <div class="hint" id="baseSlotHint"></div>
    </div>
    <div>
      <label>Màu đế (Base color)</label>
      <input type="color" id="baseColor" value="#2b2e38">
      <div class="swatches" data-target="baseColor"></div>
    </div>
  </div>

  <!-- Keycap colors -->
  <div id="keyColorBox" class="box">
    <div class="row" style="align-items:center">
      <div style="flex:1">Chỉnh sửa: <span id="editing">Tất cả</span></div>
      <button class="btn" id="selectAll" style="flex:0 0 auto">Chọn tất cả</button>
    </div>
    <div class="hint" style="margin-top:-6px">Bấm vào keycap muốn chỉnh màu riêng lẻ</div>

      <label>Màu keycap</label>
      <input type="color" id="capColor" value="#f4f1ea">
      <div class="swatches" data-target="capColor"></div>
    </div>
    <div>
      <label>Màu chữ / biểu tượng</label>
      <input type="color" id="legendColor" value="#e2574c">
      <div class="swatches" data-target="legendColor"></div>
    </div>
  </div>

  <div>
    <label>Lưu thiết kế</label>
    <button class="btn primary" id="exportPng" style="width:100%;padding:11px">Xuất hình ảnh (PNG)</button>
    
  </div>
</div>
<div id="view"><div id="loading"></div><div id="tip">made by montree</div></div>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const PALETTE = ['#f4f1ea','#1e1e1e','#e2574c','#f2a541','#f7d84a','#7bc67b','#4aa3df','#8a6fdf','#f48fb1','#9e9e9e'];
const TOP_Z = 5.0, EPS = 0.02;
const CAP_SIZE = 18, GAP = 4;
const BLANK_FILE = 'obj_16_keycap.stl';
const DEFAULT_TTF = 'SVN-Comic Sans MS.ttf';
const TEXT_SIZE = 11, TEXT_DEPTH = 0.6, FONT_WEIGHT_OFFSET = 0.04;

const BASE_STYLE1_FILES = {
  1: 'obj_1_1 slot - switch hole.stl',
  2: 'obj_2_2 slots - switch hole.stl',
  3: 'obj_3_3 slots - switch hole.stl',
  4: 'obj_4_4 slots - switch hole.stl',
  5: 'obj_5_5 slots - switch hole.stl',
  6: 'obj_7_6 slots - switch hole.stl',
  7: 'obj_8_7 slots - switch hole.stl',
  8: 'obj_9_8 slots - switch hole.stl',
  9: 'obj_10_9 slots - switch hole.stl',
  10: 'obj_6_10 slots - switch hole.stl'
};
const BASE_PITCH = 20.5;
const BASE_KEYCHAIN_OFFSET_X = 1.94;
const PREVIEW_CAP_Z = 14.5;

// ---------- Scene ----------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1d1f24');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 2000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(20, -20, 40);
scene.add(dir);

const display = new THREE.Group();
scene.add(display);

let currentWidth = null, userRotated = false;
controls.addEventListener('start', () => { userRotated = true; controls.autoRotate = false; });
function frameCamera(width, targetZ = 3) {
  controls.target.z = targetZ;
  if (currentWidth === width) return;
  const aspect = Math.max(0.4, (view.clientWidth || 1) / (view.clientHeight || 1));
  const effWidth = aspect < 1 ? width / aspect : width;
  const d = Math.max(30, effWidth * 1.1);
  if (currentWidth === null) {
    camera.position.set(0, -d, d + targetZ);
    controls.target.set(0, 0, targetZ);
    controls.autoRotateSpeed = 1.5;
  } else {
    const offset = camera.position.clone().sub(controls.target);
    const dirVec = offset.lengthSq() > 0 ? offset.normalize() : new THREE.Vector3(0, -1, 1).normalize();
    camera.position.copy(controls.target).addScaledVector(dirVec, d * Math.SQRT2);
  }
  controls.autoRotate = !userRotated && width < 40;
  currentWidth = width;
}

// ---------- Per-key & Base colors ----------
const defaults = { cap: '#f4f1ea', legend: '#e2574c' };
let keyColors = [];
let keys = [];
let selected = -1;
let baseMesh = null;
let baseMat = null;

const capColor = document.getElementById('capColor'), legendColor = document.getElementById('legendColor');
const baseColor = document.getElementById('baseColor');
const editingEl = document.getElementById('editing');

function colorsFor(i) { return keyColors[i] ||= { ...defaults }; }

function refreshMaterials() {
  keys.forEach((k, i) => {
    const c = colorsFor(i);
    k.capMat.color.set(c.cap);
    k.legMat.color.set(c.legend);
    const glow = i === selected ? 0x223344 : 0x000000;
    k.capMat.emissive.setHex(glow);
    k.legMat.emissive.setHex(glow);
  });
  if (baseMat) baseMat.color.set(baseColor.value);
}

function select(i) {
  selected = i;
  const c = i < 0 ? defaults : colorsFor(i);
  capColor.value = c.cap;
  legendColor.value = c.legend;
  editingEl.textContent = i < 0 ? 'Tất cả' : `Phím ${i + 1}${keys[i]?.label ? ' (' + keys[i].label + ')' : ''}`;
  refreshMaterials();
}

function setColor(part, value) {
  if (selected < 0) {
    defaults[part] = value;
    keyColors.forEach(c => c[part] = value);
  } else {
    colorsFor(selected)[part] = value;
  }
  refreshMaterials();
}
capColor.oninput = () => setColor('cap', capColor.value);
legendColor.oninput = () => setColor('legend', legendColor.value);
baseColor.oninput = refreshMaterials;
document.getElementById('selectAll').onclick = () => select(-1);
document.querySelectorAll('.swatches').forEach(box => PALETTE.forEach(col => {
  const b = document.createElement('button');
  b.style.background = col;
  b.onclick = () => {
    const input = document.getElementById(box.dataset.target);
    input.value = col;
    input.oninput();
  };
  box.appendChild(b);
}));

const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(display.children, true)[0];
  if (hit && hit.object.parent?.userData.index !== undefined) select(hit.object.parent.userData.index);
  else select(-1);
});

// ---------- STL loading: keycaps & bases ----------
function splitGeometry(geo) {
  geo.computeBoundingBox();
  const c = new THREE.Vector3(); geo.boundingBox.getCenter(c);
  geo.translate(-c.x, -c.y, 0);
  const pos = geo.attributes.position.array, nor = geo.attributes.normal.array;
  const cap = { p: [], n: [] }, leg = { p: [], n: [] };
  for (let i = 0; i < pos.length; i += 9) {
    const z0 = pos[i+2], z1 = pos[i+5], z2 = pos[i+8];
    const isLegend = Math.min(z0, z1, z2) >= TOP_Z - EPS && Math.max(z0, z1, z2) > TOP_Z + EPS;
    const t = isLegend ? leg : cap;
    for (let k = 0; k < 9; k++) { t.p.push(pos[i+k]); t.n.push(nor[i+k]); }
  }
  const make = t => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(t.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(t.n, 3));
    return g;
  };
  return { cap: make(cap), legend: make(leg) };
}

function centerBaseGeometry(geo) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const cx = (bb.min.x + bb.max.x) / 2 + BASE_KEYCHAIN_OFFSET_X;
  const cy = (bb.min.y + bb.max.y) / 2;
  geo.translate(-cx, -cy, -bb.min.z);
  return geo;
}

const stlLoader = new STLLoader();
const cache = {};
const baseCache = {};
const loadingEl = document.getElementById('loading');

async function getParts(file) {
  if (!cache[file]) cache[file] = splitGeometry(await stlLoader.loadAsync('Chunky+Keycaps_stls/' + encodeURIComponent(file)));
  return cache[file];
}

async function getBaseGeo(slots) {
  const s = Math.max(1, Math.min(10, slots));
  if (!baseCache[s]) {
    const path = `Compact+Fidget+Clicker+-+Base_stls/${encodeURIComponent(BASE_STYLE1_FILES[s])}`;
    baseCache[s] = centerBaseGeometry(await stlLoader.loadAsync(path));
  }
  return baseCache[s];
}

function clearDisplay() {
  display.traverse(o => { if (o.isMesh) { if (o.userData.ownGeo) o.geometry.dispose(); o.material.dispose(); } });
  display.clear();
  keys = [];
  baseMesh = null;
  baseMat = null;
}

function addKey(capGeo, legGeo, x, y, z, label, ownLegend) {
  const index = keys.length;
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.userData.index = index;
  const capMat = new THREE.MeshStandardMaterial({ roughness: 0.55 });
  const legMat = new THREE.MeshStandardMaterial({ roughness: 0.4 });
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.userData.part = 'cap';
  group.add(cap);
  if (legGeo && legGeo.attributes.position.count > 0) {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.userData.part = 'legend';
    leg.userData.ownGeo = ownLegend;
    group.add(leg);
  }
  display.add(group);
  keys.push({ group, capMat, legMat, label, x, y });
}

function addBase(geo) {
  baseMat = new THREE.MeshStandardMaterial({ color: baseColor.value, roughness: 0.55 });
  baseMesh = new THREE.Mesh(geo, baseMat);
  baseMesh.userData.part = 'base';
  display.add(baseMesh);
}

function finishBuild(width, targetZ = 3) {
  keyColors.length = Math.max(keyColors.length, keys.length);
  if (selected >= keys.length) selected = -1;
  select(selected);
  loadingEl.textContent = '';
  frameCamera(width, targetZ);
}

// ---------- Keycap sequence (Text + Icons at ANY position) ----------
let mode = 'text';
let font = null;
let icons = []; // [{name, file, afterText}]

const textInput = document.getElementById('textInput'), perCapInput = document.getElementById('perCap');
const capCountEl = document.getElementById('capCount');
const baseSlotsSelect = document.getElementById('baseSlots');
const baseSlotHint = document.getElementById('baseSlotHint');
const iconSearch = document.getElementById('iconSearch');
const iconSelect = document.getElementById('iconSelect');
const addedIconsEl = document.getElementById('addedIcons');

function getTextChunks() {
  const chars = [...textInput.value.replace(/\s+/g, '')];
  const per = Math.max(1, Math.min(6, parseInt(perCapInput.value) || 1));
  const chunks = [];
  for (let i = 0; i < chars.length; i += per) chunks.push(chars.slice(i, i + per).join(''));
  return chunks;
}

function getSequence() {
  const chunks = getTextChunks();
  const T = chunks.length;
  icons.forEach(ic => { ic.afterText = Math.max(0, Math.min(T, ic.afterText)); });
  const seq = [];
  for (let t = 0; t <= T; t++) {
    icons.forEach((ic, idx) => {
      if (ic.afterText === t) seq.push({ type: 'icon', file: ic.file, label: ic.name, iconIdx: idx });
    });
    if (t < T) seq.push({ type: 'text', label: chunks[t], textIdx: t });
  }
  return seq;
}

function getTextModeItems() {
  const seq = getSequence();
  return seq.length ? seq : [{ type: 'text', label: '' }];
}

function updateIconControls() {
  const seq = getSequence();
  addedIconsEl.innerHTML = '';
  seq.forEach((it, seqIdx) => {
    if (it.type !== 'icon') return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    const title = document.createElement('span');
    title.textContent = `Phím ${seqIdx + 1}: ${it.label}`;
    const actions = document.createElement('div');
    actions.className = 'chip-actions';

    const leftBtn = document.createElement('button');
    leftBtn.textContent = '◀';
    leftBtn.title = 'Dịch sang trái';
    leftBtn.disabled = seqIdx === 0;
    leftBtn.onclick = () => moveIcon(it.iconIdx, -1);

    const rightBtn = document.createElement('button');
    rightBtn.textContent = '▶';
    rightBtn.title = 'Dịch sang phải';
    rightBtn.disabled = seqIdx === seq.length - 1;
    rightBtn.onclick = () => moveIcon(it.iconIdx, 1);

    const delBtn = document.createElement('button');
    delBtn.className = 'del';
    delBtn.textContent = '×';
    delBtn.title = 'Xóa biểu tượng';
    delBtn.onclick = () => { icons.splice(it.iconIdx, 1); refreshScene(); };

    actions.append(leftBtn, rightBtn, delBtn);
    chip.append(title, actions);
    addedIconsEl.appendChild(chip);
  });
}

function moveIcon(iconIdx, dir) {
  const seq = getSequence();
  const pos = seq.findIndex(it => it.type === 'icon' && it.iconIdx === iconIdx);
  const targetPos = pos + dir;
  if (targetPos < 0 || targetPos >= seq.length) return;
  const neighbor = seq[targetPos];
  if (neighbor.type === 'text') {
    icons[iconIdx].afterText += dir;
  } else {
    const otherIdx = neighbor.iconIdx;
    const tmp = icons[iconIdx];
    icons[iconIdx] = icons[otherIdx];
    icons[otherIdx] = tmp;
  }
  refreshScene();
}

document.getElementById('addIconStart').onclick = () => {
  const opt = iconSelect.selectedOptions[0];
  if (!opt) return;
  icons.unshift({ name: opt.text, file: opt.value, afterText: 0 });
  refreshScene();
};
document.getElementById('addIconEnd').onclick = () => {
  const opt = iconSelect.selectedOptions[0];
  if (!opt) return;
  icons.push({ name: opt.text, file: opt.value, afterText: getTextChunks().length });
  refreshScene();
};

function getActiveSlots() {
  if (baseSlotsSelect.value !== 'auto') return parseInt(baseSlotsSelect.value);
  return Math.max(1, Math.min(10, getTextModeItems().length));
}

function updateSlotHint() {
  const s = getActiveSlots();
  baseSlotHint.textContent = `Đang dùng: Đế ${s} khe (${s} slot${s > 1 ? 's' : ''})`;
}

// ---------- Default TTF Font (Fixed to SVN-Comic Sans MS.ttf for customers) ----------
new TTFLoader().load(encodeURIComponent(DEFAULT_TTF), json => {
  font = new FontLoader().parse(json);
  refreshScene();
});

function makeLegend(str) {
  const offset = FONT_WEIGHT_OFFSET * TEXT_SIZE;
  const geo = new TextGeometry(str, {
    font, size: TEXT_SIZE, height: TEXT_DEPTH, curveSegments: 6,
    bevelEnabled: true, bevelThickness: 0, bevelSize: 0, bevelOffset: offset, bevelSegments: 1
  });
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
  const maxW = CAP_SIZE - 4;
  const s = Math.min(1, maxW / w, maxW / h);
  geo.translate(-(bb.min.x + w / 2), -(bb.min.y + h / 2), 0);
  geo.scale(s, s, 1);
  geo.translate(0, 0, TOP_Z - 0.05);
  return geo;
}

async function showText() {
  if (mode !== 'text') return;
  updateIconControls();
  if (!font) { loadingEl.textContent = 'Đang tải font…'; return; }
  const items = getTextModeItems();
  capCountEl.textContent = `${items.length} keycap sẽ được tạo`;
  updateSlotHint();

  loadingEl.textContent = 'Đang tải…';
  const blank = await getParts(BLANK_FILE);
  const iconFiles = [...new Set(items.filter(it => it.type === 'icon').map(it => it.file))];
  await Promise.all(iconFiles.map(f => getParts(f)));
  if (mode !== 'text') return;

  clearDisplay();
  const maxCols = window.innerWidth <= 768 ? 5 : 10;
  const pitch = CAP_SIZE + GAP, cols = Math.min(items.length, maxCols);
  items.forEach((it, i) => {
    const x = (i % cols - (cols - 1) / 2) * pitch;
    const y = -Math.floor(i / cols) * pitch;
    if (it.type === 'icon') {
      const parts = cache[it.file];
      addKey(parts.cap, parts.legend, x, y, 0, it.label, false);
    } else {
      addKey(blank.cap, it.label ? makeLegend(it.label) : null, x, y, 0, it.label, true);
    }
  });
  finishBuild(cols * pitch, 3);
}

// ---------- Base mode ----------
async function showBase() {
  if (mode !== 'base') return;
  const slots = getActiveSlots();
  updateSlotHint();
  loadingEl.textContent = 'Đang tải…';
  const baseGeo = await getBaseGeo(slots);
  if (mode !== 'base') return;
  clearDisplay();
  addBase(baseGeo);
  finishBuild(22 + (slots - 1) * BASE_PITCH + 6, 8);
}

// ---------- Preview mode (Keycaps mounted on top of Base) ----------
async function showPreview() {
  if (mode !== 'preview') return;
  const slots = getActiveSlots();
  updateSlotHint();
  loadingEl.textContent = 'Đang tải…';

  if (!font) { loadingEl.textContent = 'Đang tải font…'; return; }
  const items = getTextModeItems();
  const iconFiles = [...new Set(items.filter(it => it.type === 'icon').map(it => it.file))];
  const [baseGeo, blank] = await Promise.all([
    getBaseGeo(slots),
    getParts(BLANK_FILE),
    ...iconFiles.map(f => getParts(f))
  ]);
  if (mode !== 'preview') return;
  clearDisplay();
  addBase(baseGeo);
  for (let i = 0; i < slots; i++) {
    const it = items[i] || { type: 'text', label: '' };
    const x = (i - (slots - 1) / 2) * BASE_PITCH;
    if (it.type === 'icon') {
      const parts = cache[it.file];
      addKey(parts.cap, parts.legend, x, 0, PREVIEW_CAP_Z, it.label, false);
    } else {
      addKey(blank.cap, it.label ? makeLegend(it.label) : null, x, 0, PREVIEW_CAP_Z, it.label, true);
    }
  }
  finishBuild(22 + (slots - 1) * BASE_PITCH + 6, 10);
}

function refreshScene() {
  updateIconControls();
  if (mode === 'text') showText();
  else if (mode === 'base') showBase();
  else if (mode === 'preview') showPreview();
}

textInput.oninput = refreshScene;
perCapInput.oninput = refreshScene;
baseSlotsSelect.onchange = () => { updateSlotHint(); refreshScene(); };

// ---------- Mode tabs ----------
const tabText = document.getElementById('tabText');
const tabBase = document.getElementById('tabBase');
const tabPreview = document.getElementById('tabPreview');

function setMode(m) {
  mode = m;
  selected = -1;
  tabText.classList.toggle('active', m === 'text');
  tabBase.classList.toggle('active', m === 'base');
  tabPreview.classList.toggle('active', m === 'preview');

  document.getElementById('textSection').classList.toggle('hidden', m !== 'text');
  document.getElementById('baseSection').classList.toggle('hidden', m !== 'base' && m !== 'preview');
  document.getElementById('keyColorBox').classList.toggle('hidden', m === 'base');

  refreshScene();
}
tabText.onclick = () => setMode('text');
tabBase.onclick = () => setMode('base');
tabPreview.onclick = () => setMode('preview');

// ---------- PNG Image Export ----------
function usedColors() {
  const list = [];
  const add = col => {
    col = col.toUpperCase();
    if (!list.includes(col)) list.push(col);
  };
  if (mode === 'base' || mode === 'preview') add(baseColor.value);
  if (mode !== 'base') {
    keys.forEach((k, i) => {
      const c = colorsFor(i);
      add(c.cap);
      if (k.group.children.length > 1) add(c.legend);
    });
  }
  return list;
}

function exportPNG() {
  keys.forEach(k => { k.capMat.emissive.setHex(0); k.legMat.emissive.setHex(0); });
  renderer.render(scene, camera);

  const src = renderer.domElement;
  const footerH = Math.max(70, Math.round(src.height * 0.1));
  const out = document.createElement('canvas');
  out.width = src.width;
  out.height = src.height + footerH;
  const ctx = out.getContext('2d');

  ctx.drawImage(src, 0, 0);
  ctx.fillStyle = '#262930';
  ctx.fillRect(0, src.height, out.width, footerH);

  const pad = Math.round(footerH * 0.28);
  const fontSize = Math.max(13, Math.round(footerH * 0.25));
  ctx.fillStyle = '#eee';
  ctx.font = `600 ${fontSize}px system-ui, sans-serif`;
  const slots = getActiveSlots();
  const summary = mode === 'base'
    ? `18.studio · Đế (${slots} khe) · Màu đế: ${baseColor.value.toUpperCase()}`
    : `18.studio · Đế (${slots} khe) · Đế ${baseColor.value.toUpperCase()} · ${keys.length} phím`;
  ctx.fillText(summary, pad, src.height + Math.round(footerH * 0.62));

  const cols = usedColors();
  const r = Math.max(9, Math.round(footerH * 0.22));
  let cx = out.width - pad - r;
  const cy = src.height + Math.round(footerH / 2);
  for (let i = cols.length - 1; i >= 0; i--) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = cols[i];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#555';
    ctx.stroke();
    cx -= r * 2.5;
  }

  refreshMaterials();
  out.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '18studio_keycap_design.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
document.getElementById('exportPng').onclick = exportPNG;

// ---------- Icon dropdown ----------
const models = await (await fetch('models.json')).json();
const iconModels = models.filter(m => m.category === 'icon');
function fillIcons() {
  const q = iconSearch.value.toLowerCase();
  const prev = iconSelect.value;
  iconSelect.innerHTML = '';
  iconModels.filter(m => m.name.toLowerCase().includes(q)).forEach(m => iconSelect.add(new Option(m.name, m.file)));
  if ([...iconSelect.options].some(o => o.value === prev)) iconSelect.value = prev;
}
iconSearch.oninput = fillIcons;
fillIcons();
updateSlotHint();
updateIconControls();

function resize() {
  const w = view.clientWidth || 1, h = view.clientHeight || 1;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
